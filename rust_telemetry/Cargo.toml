[package]
name = "rust_telemetry"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_telemetry"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind" # PyO3 converts panics into pyo3_runtime.PanicException at the FFI boundary
